<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">AetherStack application icon</title>
  <desc id="description">A precision camera aperture forming the crossbar of a luminous letter A.</desc>
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263445"/>
      <stop offset="0.45" stop-color="#111923"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="0.22" stop-color="#a9ccfa"/>
      <stop offset="0.72" stop-color="#5c8bc7"/>
      <stop offset="1" stop-color="#315b91"/>
    </linearGradient>
    <radialGradient id="glass" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#9ce4ff"/>
      <stop offset="0.23" stop-color="#3f8fd1"/>
      <stop offset="0.55" stop-color="#1c3e70"/>
      <stop offset="0.82" stop-color="#101b3c"/>
      <stop offset="1" stop-color="#050814"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="54" y="54" width="916" height="916" rx="218" fill="url(#housing)" stroke="#52657b" stroke-width="12" filter="url(#shadow)"/>
  <path d="M249 760 452 267c22-53 98-53 120 0l203 493" fill="none" stroke="#08111e" stroke-width="142" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M249 760 452 267c22-53 98-53 120 0l203 493" fill="none" stroke="url(#metal)" stroke-width="98" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="560" r="154" fill="#080d15" stroke="#172332" stroke-width="34"/>
  <circle cx="512" cy="560" r="122" fill="url(#glass)" stroke="#91c4ff" stroke-width="10"/>
  <path d="M512 438 568 463 599 514 590 574 545 616 486 624 437 589 423 531 449 477Z" fill="#07101f" fill-opacity="0.62" stroke="#b9ddff" stroke-opacity="0.46" stroke-width="5"/>
  <circle cx="474" cy="516" r="17" fill="#eaf7ff" fill-opacity="0.9" filter="url(#glow)"/>
  <circle cx="764" cy="248" r="13" fill="#8fd8ff" filter="url(#glow)"/>
  <circle cx="824" cy="326" r="6" fill="#ddecff"/>
</svg>
