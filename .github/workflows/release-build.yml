name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: aetherstack-macos
          - os: ubuntu-latest
            label: Linux
            artifact: aetherstack-linux
          - os: windows-latest
            label: Windows
            artifact: aetherstack-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Build native bundles
        working-directory: apps/desktop
        run: npm run tauri:build

      - name: Write portable SHA-256 manifest
        working-directory: apps/desktop
        run: node scripts/write-bundle-checksums.mjs ../../target/release/bundle

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: target/release/bundle
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7

      - name: Download platform bundles
        uses: actions/download-artifact@v7
        with:
          pattern: aetherstack-*-${{ github.ref_name }}
          path: release-artifacts

      - name: Collect distributable installers
        shell: bash
        run: |
          mkdir release-files
          find release-artifacts -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.rpm' -o \
            -name '*.tar.gz' -o \
            -name '*.zip' \
          \) -exec cp --no-clobber {} release-files/ \;
          node apps/desktop/scripts/write-bundle-checksums.mjs release-files

      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-files/*
          --verify-tag
          --draft
          --generate-notes
          --title "AetherStack ${{ github.ref_name }}"
