version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # This action's tag names select the Rust toolchain. Updating the tag would
      # change the project's pinned compiler instead of updating action code.
      - dependency-name: dtolnay/rust-toolchain
